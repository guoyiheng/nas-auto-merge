# 个人配置模板。
#
# 使用方法（只需做一次）：
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   然后按需修改下面的路径与 UID:GID
#
# docker-compose.override.yml 已在 .gitignore 中，
# `git pull` 更新代码时不会被改动，之后更新只需执行 ./update.sh。
services:
  nas-auto-merge:
    # 群晖用户 UID:GID，SSH 执行 `id 用户名` 查看
    user: "1026:100"
    environment:
      # 容器内扫描目录，数量与下面的挂载一一对应
      WATCH_DIRS: /watch/source1,/watch/source2
    volumes:
      - /volume1/HDD1/video-need-merge:/watch/source1 # 第一个源目录
      - /volume1/HDD1/video-need-merge-2:/watch/source2 # 第二个源目录，按需修改
      - /volume1/docker/nas-auto-merge/config:/config # 持久化状态目录（./update.sh 会自动创建）
