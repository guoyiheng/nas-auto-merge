services:
  nas-auto-merge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nas-auto-merge
    environment:
      # 默认值；个人路径请在 docker-compose.override.yml 中覆盖
      WATCH_DIRS: /watch/source1
      MERGED_SUBDIR: merged
      PART_SUBDIR: part
      FAILED_SUBDIR: failed
      DELETE_SOURCES_ON_SUCCESS: "true"
      RUN_AT: "02:00"
      RUN_ON_START: "false"
      MIN_FILE_AGE_SECONDS: "300"
      MIN_PARTS: "2"
      EXTENSIONS: .mp4,.mkv,.mov,.m4v,.ts
      RECURSIVE: "false"
      TZ: Asia/Shanghai
    volumes:
      # 源码挂载：更新代码后无需重新构建镜像，重启即生效
      - ./src:/app
    network_mode: none
    restart: unless-stopped
